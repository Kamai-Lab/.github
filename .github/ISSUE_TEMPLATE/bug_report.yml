name: Reporte de defecto
description: Algo que ya existe no hace lo que deberia.
title: "[Bug]: "
labels: ["bug", "status:needs-review"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripcion del defecto
    validations:
      required: true

  - type: dropdown
    id: etapa
    attributes:
      label: Etapa afectada
      options:
        - Ingesta de correo (Graph)
        - Ingesta de X (Apify)
        - Limpieza de HTML, imagenes y notas
        - Deposito del material de la corrida
        - Generacion del resumen (rutina de Claude)
        - Configuracion (research.toml, .env)
        - CLI y orquestacion de la corrida
        - Portales de research
        - Otro / no se sabe
    validations:
      required: true

  - type: dropdown
    id: servicio
    attributes:
      label: Servicio externo involucrado
      description: La mayoria de las fallas viven en el borde, no en nuestro codigo.
      options:
        - Microsoft Graph
        - Apify
        - Claude
        - Google Drive / SharePoint
        - Ninguno, es codigo nuestro
        - No se sabe
    validations:
      required: true

  - type: textarea
    id: reproducir
    attributes:
      label: Pasos para reproducir
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: input
    id: corrida
    attributes:
      label: Corrida donde ocurrio
      description: Fecha y ventana. La salida depende del material, asi que sin esto no se reproduce.
      placeholder: "2026-08-04, ventana 7:30"

  - type: dropdown
    id: payload
    attributes:
      label: Capturaste la respuesta cruda que lo produjo?
      description: En este repo un fixture real ya desmintio tres suposiciones de una sola vez. Si la tienes, adjúntala.
      options:
        - Si, la adjunto abajo
        - Si, ya esta en tests/fixtures/
        - No, no la capture
        - No aplica
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Que deberia haber pasado
    validations:
      required: true

  - type: textarea
    id: real
    attributes:
      label: Que paso en cambio
      description: Error exacto, con el codigo si lo hay (ej. IDX14100).
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs o payload
      render: shell
