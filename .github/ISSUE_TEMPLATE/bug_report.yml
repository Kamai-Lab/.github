name: Reporte de defecto
description: Algo que ya existe no hace lo que debería.
title: "[Bug]: "
labels: ["status:needs-review"]
type: Bug
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del defecto
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Área afectada
      description: Qué parte del proyecto falla. Módulo, pantalla, endpoint o proceso.
      placeholder: "Login, envío de correos, importación de datos..."
    validations:
      required: true

  - type: dropdown
    id: origen
    attributes:
      label: Dónde parece estar la falla
      description: La mayoría de las fallas viven en el borde, no en nuestro código.
      options:
        - En nuestro código
        - En un servicio externo (API, proveedor, integración)
        - En la configuración o el entorno
        - En los datos de entrada
        - No se sabe
    validations:
      required: true

  - type: input
    id: servicio
    attributes:
      label: Servicio externo involucrado
      description: Solo si aplica. Nombre del proveedor o API.
      placeholder: "Microsoft Graph, Stripe, OpenAI..."

  - type: textarea
    id: reproducir
    attributes:
      label: Pasos para reproducir
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Qué debería haber pasado
    validations:
      required: true

  - type: textarea
    id: real
    attributes:
      label: Qué pasó en cambio
      description: Error exacto, con el código si lo hay.
    validations:
      required: true

  - type: dropdown
    id: evidencia
    attributes:
      label: ¿Tienes la evidencia que lo produjo?
      description: Payload crudo, captura, archivo de entrada. Un caso real vale más que una descripción.
      options:
        - Sí, la adjunto abajo
        - Sí, ya está en el repo
        - No la capturé
        - No aplica
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs o evidencia
      render: shell

