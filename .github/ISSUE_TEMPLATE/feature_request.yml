name: Propuesta de mejora
description: Una capacidad que todavía no existe y hay que decidir si entra.
title: "[Feat]: "
labels: ["status:needs-review"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Esto es una propuesta: puede rechazarse o diferirse.
        Si el trabajo ya está decidido y tiene owner, usa **Tarea asignada**.

  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: Qué duele hoy. Si no duele, no es una mejora.
    validations:
      required: true

  - type: textarea
    id: solucion
    attributes:
      label: Solución propuesta
      description: Cómo se comporta desde el lado de quien lo usa, no cómo se implementa.
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Área afectada
      description: Qué parte del proyecto cambia. Si toca varias, escribe "Transversal".
      placeholder: "Login, reportes, integración con X, Transversal..."
    validations:
      required: true

  - type: dropdown
    id: impacto
    attributes:
      label: A quién beneficia
      options:
        - Al cliente final
        - Al equipo interno
        - A ambos
    validations:
      required: true

  - type: input
    id: fase
    attributes:
      label: Fase o hito donde entraría
      placeholder: "Fase 03, próximo sprint, sin definir..."

  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas

  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional

